name: Deploy learning site

on:
  push:
    branches: [main]
    paths:
      - docs/learn/**
      - python/minisgl/**
      - benchmark/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Starlight's "last updated" dates are read from each page's git history.
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          path: docs/learn
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
