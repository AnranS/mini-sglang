<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="交互式 mini-sglang 源码学习地图：请求旅程、心智模型、分阶段路线图与实验。">
  <title>mini-sglang 学习地图</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background: #ffffff;
      color: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1b1b; color: #e8e8e8; }
    }
    #root { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #5aa2ff; outline-offset: 2px; }
    noscript { display: block; padding: 32px; }
    @media (max-width: 760px) {
      #root { padding: 20px 14px 48px; }
      [style*="position: sticky"] { position: static !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <noscript>学习地图需要启用 JavaScript。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
